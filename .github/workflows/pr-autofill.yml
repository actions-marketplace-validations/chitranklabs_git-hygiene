# =============================================================
# Automated PR Description (Autofill)
# =============================================================

name: PR Description Autofill

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions: {}

env:
  NODE_VERSION: 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  autofill:
    name: Update PR Description
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      contents: read
    if: |
      (github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner) &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'release')
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create Bot Token
        id: generate_token
        uses: $/.github/actions/setup-bot
        with:
          client-id: ${{ secrets.CHITRANK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CHITRANK_BOT_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - name: Generate Commit Summary
        id: cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: origin/${{ github.base_ref }}..HEAD --strip all
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}

      - name: Prepare PR Description
        id: prepare
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMITS: ${{ steps.cliff.outputs.content }}
        run: |
          CURRENT_BODY=$(gh pr view "$PR_NUMBER" --json body --template '{{.body}}')
          export CURRENT_BODY
          node -e '
            import fs from "node:fs";
            const body = process.env.CURRENT_BODY || "";
            let commits = (process.env.COMMITS || "").trim();
            // Remove unreleased header and git-cliff footer
            commits = commits.replace(/^## \[unreleased\]\s*/m, "").replace(/<!-- generated by git-cliff -->\s*/g, "");
            // Strip redundant "by @author" or "by [bot](...)" in PR commit list
            commits = commits.replace(/\s+by\s+(@[\w\-\/]+|\[.*?\]\(.*?\))\s*$/gm, "").trim();

            let finalBody = "";
            if (body.includes("<!-- autofill-start -->") && body.includes("<!-- autofill-end -->")) {
              finalBody = body.replace(
                /<!-- autofill-start -->[\s\S]*?<!-- autofill-end -->/,
                `<!-- autofill-start -->\n\n${commits}\n\n<!-- autofill-end -->`
              );
            } else if (body.trim().length > 0) {
              finalBody = `${body.trim()}\n\n---\n\n<details>\n<summary>Commits</summary>\n\n<!-- autofill-start -->\n\n${commits}\n\n<!-- autofill-end -->\n\n</details>\n`;
            } else {
              finalBody = `<details open>\n<summary>Commits</summary>\n\n<!-- autofill-start -->\n\n${commits}\n\n<!-- autofill-end -->\n\n</details>\n`;
            }
            fs.writeFileSync("final_body.md", finalBody, "utf8");
          '

      - name: Update PR Description
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --body-file final_body.md \
            --add-assignee "chitrank2050"

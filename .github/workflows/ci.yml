# =============================================================
# CI: Continuous Integration 🌊
#
# Primary pipeline for code quality and security.
# Optimized to run only when relevant files change.
# =============================================================

name: CI 🌊

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/FUNDING.yml'
      - '.github/CODEOWNERS'
      - '.vscode/**'
      - '.editorconfig'
      - '.env.example'
      - 'renovate.json'
      - 'cliff.toml'
      - 'lefthook.yml'
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── CHANGE DETECTION ────────────────────────────────────────
  changes:
    name: Detect Changes 🔍
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
      deps: ${{ steps.filter.outputs.deps }}
      lint: ${{ steps.filter.outputs.lint }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            src:
              - 'packages/**'
              - 'app/**'
              - 'docs/**'
              - 'assets/**'
            deps:
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
            lint:
              - 'eslint.config.mjs'
              - 'tsconfig.json'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'scripts/**'
              - 'deno.json'

  # ─── QUALITY ASSURANCE ───────────────────────────────────────
  quality:
    name: Hygiene & Security 🧼🛡️
    needs: changes
    if: needs.changes.outputs.src == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.lint == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pnpm 📦
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js 🟢
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies 🛠️
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build Project 🏗️
        if: needs.changes.outputs.src == 'true' || needs.changes.outputs.deps == 'true'
        run: pnpm build

      - name: Verify website and documentation
        if: needs.changes.outputs.src == 'true' || needs.changes.outputs.deps == 'true'
        run: |
          pnpm --filter git-hygiene-app test:seo

      - name: Test release guards
        run: node --test scripts/tests/*.test.mjs

      - name: Build sandbox dependency for workflow-only checks
        if: needs.changes.outputs.src != 'true' && needs.changes.outputs.deps != 'true'
        run: pnpm --filter @chitrank2050/git-hygiene-core build

      - name: Test live sandbox validation
        run: pnpm --filter git-hygiene-app test:sandbox

      - name: Run Parallel Checks ⚡️
        id: run_checks
        env:
          HAS_SRC: ${{ needs.changes.outputs.src }}
        run: |
          echo "::group::Starting Parallel Checks"
          mkdir -p .ci-status
          if [ "$HAS_SRC" == "true" ]; then
            (pnpm test:cov > .ci-status/test.log 2>&1 || echo "1" > .ci-status/test.fail) &
          fi
          (pnpm lint > .ci-status/lint.log 2>&1 || echo "1" > .ci-status/lint.fail) &
          (pnpm lint:md > .ci-status/md.log 2>&1 || echo "1" > .ci-status/md.fail) &
          (
            if curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors \
              https://github.com/google/osv-scanner/releases/download/v2.3.5/osv-scanner_linux_amd64 -o osv-scanner; then
              chmod +x osv-scanner
              ./osv-scanner --lockfile=pnpm-lock.yaml > .ci-status/osv.log 2>&1 || echo "1" > .ci-status/osv.fail
            else
              echo "❌ Failed to download osv-scanner after 5 retries" > .ci-status/osv.log
              echo "1" > .ci-status/osv.fail
            fi
          ) &
          wait
          echo "::endgroup::"

          EXIT_CODE=0
          for log in .ci-status/*.log; do
            job=$(basename "$log" .log)
            if [ -f ".ci-status/$job.fail" ]; then
              echo "::error::❌ $job failed"
              cat "$log"
              EXIT_CODE=1
            else
              echo "✅ $job passed"
            fi
          done
          exit $EXIT_CODE

      - name: Upload coverage to Codecov 📊
        if: needs.changes.outputs.src == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/*/coverage/lcov.info
          fail_ci_if_error: false

  secret_scan:
    name: Secret Scan 🔑
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks 🕵️
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

# =============================================================
# Release Preparation Workflow
#
# Triggered manually to:
#   1. Apply Changesets version bumps to workspace packages.
#   2. Synchronize JSR versions and root package.json.
#   3. Update CHANGELOG.md using git-cliff.
#   4. Open a Release PR for review.
# =============================================================

name: Release 1 - Prepare PR 📝

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Manual tag override (e.g. v0.5.0). Leave empty to use Changesets plan.'
        required: false

permissions: {}

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release PR 🚀
    if: github.ref == 'refs/heads/main' && (github.actor == github.repository_owner || github.actor == 'chitrank2050')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NODE_VERSION: 24
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm 📦
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.6
          run_install: false

      - name: Setup Node.js 🟢
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup Deno 🦕
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7

      - name: Install dependencies 📥
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Create Bot Token 🤖🔑
        id: generate_token
        uses: $/.github/actions/setup-bot
        with:
          client-id: ${{ secrets.CHITRANK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CHITRANK_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Configure Authenticated Git 🔧
        env:
          TOKEN: ${{ steps.generate_token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${REPO}"

      - name: Apply Version Bumps 📦
        id: vars
        env:
          MANUAL_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          OLD_VERSION=$(jq -r .version packages/cli/package.json)

          if [ -n "$MANUAL_TAG" ]; then
            [[ "$MANUAL_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::Expected a stable vX.Y.Z tag'; exit 1; }
            CLEAN_TAG="${MANUAL_TAG#v}"
            echo "Applying manual version override: $CLEAN_TAG"
            for pkg in packages/cli packages/core; do
              jq --arg version "$CLEAN_TAG" '.version = $version' "$pkg/package.json" > "$pkg/package.json.tmp" && mv "$pkg/package.json.tmp" "$pkg/package.json"
            done
            node scripts/sync-jsr-versions.mjs
          else
            echo "Applying Changesets versioning..."
            pnpm version:packages
          fi

          NEW_VERSION=$(jq -r .version packages/cli/package.json)
          echo "Previous version: $OLD_VERSION"
          echo "Target version:   $NEW_VERSION"

          if [ "$OLD_VERSION" == "$NEW_VERSION" ]; then
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ No package versions changed. Nothing to release."
          else
            node --input-type=module -e 'import assert from "node:assert/strict"; const [oldVersion, nextVersion] = process.argv.slice(1).map(v => v.split(".").map(Number)); const index = nextVersion.findIndex((v, i) => v !== oldVersion[i]); assert(index >= 0 && nextVersion[index] > oldVersion[index], "Release version must increase");' "$OLD_VERSION" "$NEW_VERSION"
            echo "release_ready=true" >> "$GITHUB_OUTPUT"
            echo "clean_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "tag_name=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Update CHANGELOG.md 📝
        if: steps.vars.outputs.release_ready == 'true'
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        id: git-cliff
        with:
          config: cliff.toml
          args: --tag ${{ steps.vars.outputs.tag_name }} --output CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}

      - name: Re-lock and Format Release Files 🎨
        if: steps.vars.outputs.release_ready == 'true'
        run: |
          pnpm install --lockfile-only --ignore-scripts --prefer-offline
          pnpm exec prettier --write CHANGELOG.md package.json 'packages/*/package.json' 'packages/*/jsr.json' 'packages/*/CHANGELOG.md' --no-error-on-unmatched-pattern

      # The commit-msg hook runs the source CLI, whose core import resolves to dist.
      # Build only that dependency; release preparation does not need the website.
      - name: Build release hook dependency 🏗️
        if: steps.vars.outputs.release_ready == 'true'
        env:
          RELEASE_TAG: ${{ steps.vars.outputs.tag_name }}
        run: |
          node scripts/release-artifacts.mjs check
          pnpm --filter @chitrank2050/git-hygiene-core build
          pnpm build:action

      - name: Create Pull Request for Release 🔀
        id: cpr
        if: steps.vars.outputs.release_ready == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate_token.outputs.token }}
          commit-message: 'chore(release): bump version to ${{ steps.vars.outputs.tag_name }}'
          title: 'chore(release): 🚀 ${{ steps.vars.outputs.tag_name }}'
          body: |
            ## Monorepo Release ${{ steps.vars.outputs.tag_name }}

            This release PR was generated with **Changesets** and **git-cliff**:
            - Synchronized packages: `@chitrank2050/git-hygiene` and `@chitrank2050/git-hygiene-core`
            - Synchronized JSR configs: `packages/cli/jsr.json` and `packages/core/jsr.json`
            - Generated root `CHANGELOG.md` and package changelogs.
            - Note: `app/` web changelog is rendered dynamically on-the-fly at build time.
          labels: |
            chore
            release
          branch: 'chore/release-${{ steps.vars.outputs.tag_name }}'
          base: main
          delete-branch: true
          assignees: chitrank2050
          add-paths: |
            dist/action.js
            .changeset/*.md
            CHANGELOG.md
            package.json
            packages/*/package.json
            packages/*/jsr.json
            packages/*/CHANGELOG.md
            pnpm-lock.yaml

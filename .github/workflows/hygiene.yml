# =============================================================
# Git Hygiene Dogfooding 🌊
#
# This workflow uses the project's own CLI and logic to
# validate its own Pull Requests.
# =============================================================

name: Git Hygiene 🌊

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

env:
  NODE_VERSION: 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hygiene:
    name: Metadata Validation 🧼
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 100 # Needed to see history for commit validation

      - name: Install pnpm 📦
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js 🟢
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies 📥
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build Project 🏗️
        run: pnpm build

      - name: Validate PR Title 🏷️
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node --experimental-strip-types packages/cli/src/cli.ts title "$PR_TITLE"

      - name: Validate Branch Name 🌿
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          node --experimental-strip-types packages/cli/src/cli.ts branch "$BRANCH_NAME"

      - name: Validate Commit History 📜
        run: |
          # Fetch enough history to see the PR commits
          git fetch origin main --depth=100

          # Get list of commit SHAs in this PR
          COMMITS=$(git rev-list origin/main..HEAD)

          for sha in $COMMITS; do
            MSG=$(git log -1 --pretty=%B "$sha")
            echo "Checking commit $sha..."
            node packages/cli/dist/cli.js commit "$MSG"
          done

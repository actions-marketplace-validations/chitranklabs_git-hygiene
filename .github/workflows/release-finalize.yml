name: Release 2 - Finalize Tag 🏷️

# Builds one verified release candidate, publishes npm and JSR independently,
# and exposes targeted recovery without republishing successful registries.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version to recover (for example v0.5.0).'
        required: true
      target:
        description: 'Release surface to run.'
        type: choice
        required: true
        default: all
        options: [all, npm, jsr, github-release]
      jsr_provenance:
        description: 'Disable only to recover from a confirmed upstream provenance outage.'
        type: choice
        required: true
        default: required
        options: [required, disabled-for-recovery]

concurrency:
  group: release-publishing
  cancel-in-progress: false

permissions: {}

env:
  NODE_VERSION: 24
  DENO_VERSION: 2.9.6
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Verified Candidate 🏗️
    if: |
      (github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release')) ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'chitrank2050')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout release commit 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure release environment
        run: echo "RELEASE_ARTIFACTS=${RUNNER_TEMP}/release-artifacts" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.6
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Resolve and validate release identity
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${INPUT_VERSION:-${BRANCH_NAME#chore/release-}}"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo '::error::Expected a stable vX.Y.Z release'
            exit 1
          }
          export RELEASE_TAG
          node scripts/release-artifacts.mjs check
          git merge-base --is-ancestor HEAD origin/main
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build, test and verify committed action
        run: |
          pnpm --filter @chitrank2050/git-hygiene-core build
          pnpm --filter @chitrank2050/git-hygiene build
          pnpm build:action
          git diff --exit-code -- dist/action.js
          pnpm test

      - name: Pack and test clean-consumer artifacts
        run: node scripts/release-artifacts.mjs pack

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Validate JSR workspace
        run: deno publish --dry-run --allow-slow-types

      - name: Attest exact release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-artifacts/*

      - name: Upload immutable release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.release.outputs.tag }}
          path: ${{ runner.temp }}/release-artifacts/
          if-no-files-found: error
          retention-days: 10

  tag:
    name: Anchor Release Tag 🏷️
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout verified release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false

      - name: Create release token
        id: release_token
        uses: $/.github/actions/setup-bot
        with:
          client-id: ${{ secrets.CHITRANK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CHITRANK_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Create or verify immutable tag
        env:
          GH_TOKEN: ${{ steps.release_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          if TAG_SHA="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null)"; then
            [ "$TAG_SHA" = "$RELEASE_SHA" ] || {
              echo "::error::Tag $RELEASE_TAG points to $TAG_SHA, expected $RELEASE_SHA"
              exit 1
            }
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_SHA"
          fi

  publish-npm:
    name: Publish npm 📦
    needs: [build, tag]
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.target == 'all' ||
      inputs.target == 'npm'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.tag }}
          persist-credentials: false

      - name: Download verified candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: ${{ runner.temp }}/release-artifacts

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Publish or verify npm packages
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_ARTIFACTS: ${{ runner.temp }}/release-artifacts
        run: |
          test -n "$NODE_AUTH_TOKEN" || {
            echo '::error::NPM_TOKEN is required until trusted publishing is configured'
            exit 1
          }
          node scripts/release-artifacts.mjs publish-npm

  publish-jsr:
    name: Publish JSR 🦖
    needs: [build, tag]
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.target == 'all' ||
      inputs.target == 'jsr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.tag }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Publish core then CLI, skipping immutable existing versions
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          JSR_PROVENANCE: ${{ inputs.jsr_provenance || 'required' }}
        run: |
          set -euo pipefail
          PUBLISH_ARGS=(--allow-slow-types)
          if [ "$JSR_PROVENANCE" = "disabled-for-recovery" ]; then
            [ "${{ github.event_name }}" = "workflow_dispatch" ] || exit 1
            PUBLISH_ARGS+=(--no-provenance)
            echo "::warning::JSR provenance explicitly disabled for recovery"
          fi
          for package in core cli; do
            if node scripts/release-artifacts.mjs jsr-exists "$package"; then
              continue
            else
              status=$?
              [ "$status" -eq 1 ] || exit "$status"
            fi
            deno publish --config "packages/$package/jsr.json" "${PUBLISH_ARGS[@]}"
          done
          node scripts/release-artifacts.mjs verify-jsr

  create-release:
    name: Create Verified GitHub Release ✨
    needs: [build, tag, publish-npm, publish-jsr]
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.tag.result == 'success' &&
      (github.event_name != 'workflow_dispatch' ||
      inputs.target == 'all' ||
      inputs.target == 'github-release') &&
      (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped') &&
      (needs.publish-jsr.result == 'success' || needs.publish-jsr.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: ${{ runner.temp }}/release-artifacts

      - name: Verify both registries
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_ARTIFACTS: ${{ runner.temp }}/release-artifacts
        run: |
          node scripts/release-artifacts.mjs verify-npm
          node scripts/release-artifacts.mjs verify-jsr

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          # Recovery may target a release older than the note generator.
          git show "$WORKFLOW_SHA:scripts/release-notes.mjs" > "$RUNNER_TEMP/release-notes.mjs"
          node "$RUNNER_TEMP/release-notes.mjs" "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"

      - name: Create release token
        id: release_token
        uses: $/.github/actions/setup-bot
        with:
          client-id: ${{ secrets.CHITRANK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CHITRANK_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ steps.release_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_ARTIFACTS: ${{ runner.temp }}/release-artifacts
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/published-assets"
            for artifact in "$RELEASE_ARTIFACTS"/*; do
              name="$(basename "$artifact")"
              if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fqx "$name"; then
                gh release download "$RELEASE_TAG" --pattern "$name" --dir "$RUNNER_TEMP/published-assets"
                cmp "$artifact" "$RUNNER_TEMP/published-assets/$name" || {
                  echo "::error::Release asset differs: $name"
                  exit 1
                }
              else
                gh release upload "$RELEASE_TAG" "$artifact"
              fi
            done
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" "$RELEASE_ARTIFACTS"/*
          fi

  release-summary:
    name: Release Summary 📋
    needs: [build, tag, publish-npm, publish-jsr, create-release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Write recovery summary
        env:
          TAG: ${{ needs.build.outputs.tag }}
          BUILD: ${{ needs.build.result }}
          TAG_JOB: ${{ needs.tag.result }}
          NPM: ${{ needs.publish-npm.result }}
          JSR: ${{ needs.publish-jsr.result }}
          GITHUB_RELEASE: ${{ needs.create-release.result }}
        run: |
          {
            echo "## Release ${TAG:-unresolved}"
            echo "| Surface | Result |"
            echo "| --- | --- |"
            echo "| Build candidate | $BUILD |"
            echo "| Git tag | $TAG_JOB |"
            echo "| npm | $NPM |"
            echo "| JSR | $JSR |"
            echo "| GitHub Release | $GITHUB_RELEASE |"
            echo
            echo "Use **Re-run failed jobs** for an immediate retry."
            echo "For targeted recovery, dispatch this workflow with the same version and failed target."
          } >> "$GITHUB_STEP_SUMMARY"

# yaml-language-server: $schema=https://www.schemastore.org/github-action.json

name: 'Git Hygiene Validator'
description: 'Zero-dependency metadata validator for commits, branches, and PR titles'
author: 'Chitrank Agnihotri'

branding:
  icon: 'wind'
  color: 'blue'

inputs:
  command:
    description: 'The validation command to run: branch, title, commit, or bump. Defaults to "omni" for automatic detection.'
    required: false
    default: 'omni'
  value:
    description: 'The value to validate for title and commit commands.'
    required: false
    default: ''

outputs:
  releaseType:
    description: 'The recommended release type: patch, minor, or major.'
    value: ${{ steps.hygiene.outputs.releaseType }}
  reason:
    description: 'The reason for the recommended release type.'
    value: ${{ steps.hygiene.outputs.reason }}

runs:
  using: 'composite'
  steps:
    - id: hygiene
      name: Run Git Hygiene 🌊
      shell: bash
      env:
        HYGIENE_COMMAND: ${{ inputs.command }}
        HYGIENE_VALUE: ${{ inputs.value }}
        HYGIENE_PR_TITLE: ${{ github.event.pull_request.title }}
        HYGIENE_HEAD_REF: ${{ github.head_ref }}
      run: |
        set -euo pipefail

        run_hygiene() {
          node "$GITHUB_ACTION_PATH/dist/action.js" "$@"
        }

        write_bump_outputs() {
          local result
          local release_type
          local reason
          local delimiter

          result="$(run_hygiene bump --json)"
          release_type="$(jq -er '.releaseType' <<<"$result")"
          reason="$(jq -er '.reason' <<<"$result")"
          delimiter="git_hygiene_reason_${RANDOM}_${RANDOM}"

          if grep -Fxq "$delimiter" <<<"$reason"; then
            echo "::error::Unable to write the reason output safely."
            return 1
          fi

          {
            echo "releaseType=$release_type"
            echo "reason<<$delimiter"
            echo "$reason"
            echo "$delimiter"
          } >>"$GITHUB_OUTPUT"
        }

        case "$HYGIENE_COMMAND" in
          omni)
            echo "::group::🌊 Git Hygiene Omni-Mode"

            if [[ -n "$HYGIENE_PR_TITLE" ]]; then
              echo "Checking PR title..."
              run_hygiene title "$HYGIENE_PR_TITLE"
            fi

            if [[ -n "$HYGIENE_HEAD_REF" ]]; then
              echo "Checking branch name..."
              run_hygiene branch "$HYGIENE_HEAD_REF"
            fi

            echo "Calculating recommended bump..."
            write_bump_outputs
            run_hygiene bump

            echo "::endgroup::"
            ;;

          bump)
            write_bump_outputs
            run_hygiene bump
            ;;

          branch | title | commit)
            if [[ -n "$HYGIENE_VALUE" ]]; then
              run_hygiene "$HYGIENE_COMMAND" "$HYGIENE_VALUE"
            else
              run_hygiene "$HYGIENE_COMMAND"
            fi
            ;;

          *)
            echo "::error::Unsupported command: $HYGIENE_COMMAND"
            exit 1
            ;;
        esac
